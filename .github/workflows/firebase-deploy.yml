name: Deploy Nasq Code to Firebase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download intro artwork
        run: |
          curl --location --fail --retry 3 \
            "https://github.com/user-attachments/assets/aecb848e-e6f3-4c4e-b2bc-9f2856ef6ec8" \
            --output public/nasq-inside-comparison.jpeg

      - name: Build current source
        run: |
          npm ci
          npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NASQ_CODE }}

      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools@15.30.0 deploy --only hosting --project nasq-code --non-interactive

      - name: Revoke temporary Firebase key
        shell: bash
        run: |
          key_id="$(jq -r .private_key_id "$GOOGLE_GHA_CREDS_PATH")"
          gcloud iam service-accounts keys delete "$key_id" \
            --iam-account=firebase-adminsdk-fbsvc@nasq-code.iam.gserviceaccount.com \
            --project=nasq-code \
            --quiet
