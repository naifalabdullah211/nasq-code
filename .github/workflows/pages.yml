name: نشر نَسَق كود

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: تثبيت صورة المقدمة
        run: |
          curl --location --fail --retry 3 \
            "https://github.com/user-attachments/assets/aecb848e-e6f3-4c4e-b2bc-9f2856ef6ec8" \
            --output public/nasq-inside-comparison.jpeg
      - name: تجهيز الموقع
        run: |
          npm ci
          npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: نشر الموقع
        id: deployment
        uses: actions/deploy-pages@v4
